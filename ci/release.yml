name: Build & release UXGPT APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Install & sync Capacitor
        run: npm ci && npx cap sync android
      - name: Set version
        run: |
          VER="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == "tag" ]] || VER="1.0.${GITHUB_RUN_NUMBER}"
          echo "VER=$VER" >> $GITHUB_ENV
          sed -i "s/versionCode [0-9]*/versionCode $((GITHUB_RUN_NUMBER+10))/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out UXGPT.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify UXGPT.apk
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -l UXGPT.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VER) }}
          name: UXGPT ${{ env.VER }}
          make_latest: "true"
          files: UXGPT.apk
          body: |
            UXGPT for Android ${{ env.VER }} — signed release APK.
            Install: download UXGPT.apk, allow installs from this source, then open the file and tap Install.
